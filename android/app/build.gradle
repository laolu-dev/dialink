plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing (docs/release.md). Locally and in the release workflow,
// android/key.properties points at the upload keystore. Without it, release
// builds use the debug key, so `flutter run --release` still works anywhere.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.dialink.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.dialink.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Run with --flavor dev or --flavor prod (see docs/environments.md).
    // The dev build installs beside prod, with its own name and badged icons
    // (src/dev/res, made by tool/generate_app_icon.py).
    // AGP 9 turns these off by default; the flavours set the app name.
    buildFeatures {
        resValues = true
    }

    flavorDimensions = ["environment"]
    productFlavors {
        dev {
            dimension = "environment"
            applicationIdSuffix = ".dev"
            resValue "string", "app_name", "Dialink Dev"
        }
        prod {
            dimension = "environment"
            resValue "string", "app_name", "Dialink"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                // storeFile is relative to android/app.
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
