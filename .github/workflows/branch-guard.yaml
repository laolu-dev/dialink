name: Branch guard

# main only takes release pull requests from dev (feat/… → dev → main).
on:
  pull_request:
    branches: [main]

jobs:
  source:
    name: PR into main comes from dev
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Pull requests into main must come from dev, not '$HEAD_REF'. Retarget this PR to dev."
            exit 1
          fi
