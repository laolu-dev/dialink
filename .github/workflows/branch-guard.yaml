name: Branch guard

# main only takes release pull requests from dev, or hotfixes from
# release/<major>.<minor> (see CONTRIBUTING.md).
on:
  pull_request:
    branches: [main]

jobs:
  source:
    name: PR into main comes from dev
    runs-on: ubuntu-latest
    steps:
      - name: Check the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            dev|release/*) echo "Source branch '$HEAD_REF' is allowed." ;;
            *)
              echo "::error::Pull requests into main must come from dev or release/<major>.<minor>, not '$HEAD_REF'. Retarget this PR to dev."
              exit 1
              ;;
          esac
