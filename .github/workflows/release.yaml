name: Release

# Builds a store candidate from a tag (docs/release.md):
#   v1.4.0-rc.1  ->  GitHub pre-release with the signed prod APK
#   v1.4.0       ->  GitHub release with the signed prod APK
# Tags matching v* can't be moved or deleted (tag ruleset), so a failed
# candidate gets the next rc number instead of a re-tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        run: tool/release_check.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

  android:
    name: Signed Android build (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    # The only job with write access: it publishes the GitHub release (CI-10).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Write the prod env file
        env:
          ENV_PROD_JSON: ${{ vars.ENV_PROD_JSON }}
        run: |
          if [ -z "$ENV_PROD_JSON" ]; then
            echo "::error::Set the ENV_PROD_JSON repository variable (see docs/release.md)."
            exit 1
          fi
          printf '%s' "$ENV_PROD_JSON" > env/prod.json

      - name: Write the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Never publish a release signed with the debug key.
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret for $name (see docs/release.md)."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build the APK
        run: |
          flutter build apk --release --flavor prod -t lib/main_prod.dart \
            --dart-define-from-file=env/prod.json \
            --build-number=$(tool/build_number.sh) \
            --dart-define=GIT_SHA=$GITHUB_SHA

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=build/app/outputs/flutter-apk/app-prod-release.apk
          "$apksigner" verify --print-certs "$apk" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          build=$(tool/build_number.sh)
          apk="dialink-${GITHUB_REF_NAME#v}-$build.apk"
          cp build/app/outputs/flutter-apk/app-prod-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          flags=(--verify-tag --title "Dialink ${GITHUB_REF_NAME#v} (build $build)" --generate-notes --notes-file "whats_new/$VERSION.txt")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" "${flags[@]}"

  ios:
    name: iOS build check (prod, no signing)
    runs-on: macos-latest
    timeout-minutes: 40
    needs: verify
    # No Apple Developer Program account yet, so iOS can't be signed or
    # distributed. This only checks the prod flavour still builds.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: cp env/prod.example.json env/prod.json
      - run: |
          flutter build ios --simulator --flavor prod -t lib/main_prod.dart \
            --dart-define-from-file=env/prod.json \
            --build-number=$(tool/build_number.sh) \
            --dart-define=GIT_SHA=$GITHUB_SHA
