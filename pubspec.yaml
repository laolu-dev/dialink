name: dialink
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  dio: ^5.7.0
  json_annotation: ^4.9.0
  iconsax: ^0.0.8
  flutter_secure_storage: ^11.2.0
  pin_code_text_field: ^1.8.0
  intl: ^0.20.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  talker_dio_logger: ^5.1.20
  talker_riverpod_logger: ^5.1.20
  talker_flutter: ^5.1.20
  toastification: ^3.2.0
  uuid: ^4.5.1
  timezone: ^0.10.1
  shared_preferences: ^2.5.6
  google_sign_in: ^7.2.0
  flutter_svg: ^2.3.2
  go_router: ^18.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.14
  json_serializable: ^6.9.3
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    # Variable font: the weight is also set on its wght axis, see buildTheme.
    - family: Plus Jakarta Sans
      fonts:
        - asset: fonts/PlusJakartaSans-Variable.ttf

    - family: Atkinson Hyperlegible
      fonts:
        - asset: fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: fonts/AtkinsonHyperlegible-Regular.ttf
